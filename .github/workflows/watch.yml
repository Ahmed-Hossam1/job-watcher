name: Job Watcher

on:
  schedule:
    # Off-peak minutes: GitHub often delays or drops schedules on :00/:15/:30/:45.
    - cron: "7,22,37,52 * * * *"   # every 15 min
  workflow_dispatch:          # "Run workflow" button for manual runs
  repository_dispatch:        # external every-15-min trigger (cron-job.org), no status message
    types: [tick]

permissions:
  contents: write             # to save seen.json back to the repo

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check LinkedIn for new jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Save seen jobs
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen jobs [skip ci]" && git push)
